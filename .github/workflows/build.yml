name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for all jobs. Equivalent to the read-only default, but
# explicit so it stays restricted if repo/org defaults change or this workflow is
# copied elsewhere. This workflow only builds, tests, and uploads package
# artifacts — publishing to NuGet.org lives in publish.yml.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup just
        uses: extractions/setup-just@v4.0.0

      # Neither the ubuntu-latest nor the macos-latest image ships ripgrep, and the doc gates below
      # require it: `rg -U` (multiline) is what gives the factory-first AddTool pattern its recall,
      # and BSD grep on macOS has no portable equivalent. Idempotent so a future image that does
      # include rg costs nothing.
      - name: Setup ripgrep
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present: $(rg --version | head -1)"
            exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          rg --version | head -1

      - name: Build
        run: just build

      - name: Run unit tests
        run: just test-unit-all

      - name: Verify documentation and sample catalog
        run: just verify-sample-catalog verify-doc-links verify-doc-snippets verify-maf-doc-api-contracts

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup just
        uses: extractions/setup-just@v4.0.0

      - name: Pack
        run: just pack

      - name: Run extensible-turn packed-package gate
        run: just smoke-extensible-turns-packed

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
