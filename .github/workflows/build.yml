name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for all jobs. Equivalent to the read-only default, but
# explicit so it stays restricted if repo/org defaults change or this workflow is
# copied elsewhere. This workflow only builds, tests, and uploads package
# artifacts — publishing to NuGet.org lives in publish.yml.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1

# Prefixed, like integration.yml's `integration-`. A bare `${{ github.ref }}` shares a
# namespace with every other workflow, so two unrelated workflows on the same ref would
# cancel each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Observed ~90s. A hung dotnet test would otherwise burn the 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          # MinVer needs full history. justfile:12 evaluates `dotnet tool run minver` on EVERY
          # `just` invocation, so a shallow checkout here silently produced 0.0.0-preview and
          # this job compiled different assembly versions than Package and Integration did.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      # setup-dotnet's built-in `cache: true` needs a packages.lock.json, and this repo has none.
      #
      # The key deliberately does NOT hash the csproj files. Under central package management they
      # carry no versions — the only two that pin any are the smoke-test projects, and neither is
      # in TemporalAgents.slnx, so neither takes part in this restore. Hashing all 42 of them made
      # the key churn with every unrelated project edit (133 csproj changes in the last 50 commits
      # against 11 for Directory.Packages.props), and each new key writes ~365MB per OS. At the
      # 10GB repo limit that thrashing evicts other caches, including the temporal-cli one the
      # integration workflow depends on.
      #
      # A package cache does not need to be exact: if a new PackageReference lands without changing
      # the key, the stale cache restores and `dotnet restore` fetches the one missing package.
      - name: Cache NuGet packages
        uses: actions/cache@v5.0.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup just
        uses: extractions/setup-just@v4.0.0

      - name: Build
        run: just build

      - name: Run unit tests
        run: just test-unit-all

      # OS-independent, so it runs on one leg rather than both. It needs no build step of its
      # own: DocSnippets.csproj is in the solution (TemporalAgents.slnx:14), so `just build`
      # above already compiled every documented example. That compile IS the guarantee — the
      # verify scripts only check marker coverage and text fidelity.
      - name: Verify documentation and sample catalog
        if: matrix.os == 'ubuntu-latest'
        run: just verify-sample-catalog verify-doc-links verify-doc-snippets

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]
    # Observed ~116s; `just pack` is a serialized clean/restore/build/pack.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup just
        uses: extractions/setup-just@v4.0.0

      - name: Pack
        run: just pack

      - name: Run extensible-turn packed-package gate
        run: just smoke-extensible-turns-packed

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
