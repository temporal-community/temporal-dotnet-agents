name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type for the selected ref
        required: true
        default: preview
        type: choice
        options:
          - preview
          - official

permissions:
  contents: read

jobs:
  publish:
    name: Pack and publish ${{ inputs.release_type }} packages to NuGet.org
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget-publish   # configure this environment in GitHub repo settings
    permissions:
      contents: read
      id-token: write   # required for OIDC Trusted Publishing token exchange

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # MinVer needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Verify release type and version
        run: |
          release_type="${{ inputs.release_type }}"
          version=$(dotnet tool run minver --default-pre-release-identifiers preview)
          if [[ "$release_type" == "preview" ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
              echo "::error::Preview publishing requires MinVer to calculate a SemVer prerelease version."
              echo "::error::Select an untagged commit after a release tag, or a commit tagged with a prerelease version."
              exit 1
            fi
            echo "Preview version: $version"
          elif [[ "$release_type" == "official" ]]; then
            tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
            if [[ -z "$tag" ]]; then
              echo "::error::Official publishing requires an exact release tag."
              echo "::error::Tag the release commit and dispatch this workflow from that tag."
              exit 1
            fi

            normalized_tag="${tag#v}"
            echo "Release tag: $tag; MinVer version: $version"
            if [[ "$version" != "$normalized_tag" ]]; then
              echo "::error::Release tag '$tag' and MinVer version '$version' do not match."
              exit 1
            fi
            if [[ ! "$normalized_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Official releases require a stable SemVer tag such as 0.10.3."
              exit 1
            fi
          else
            echo "::error::Unsupported release type '$release_type'."
            exit 1
          fi

          echo "Release type: $release_type; MinVer version: $version"

      # An official release must ship a public API baseline that already describes what it
      # publishes. Promoting afterwards is what failed before: Shipped.txt sat empty from 0.8.0
      # through 0.14.2 while 40+ public types shipped, leaving the RS0016/RS0017 gate inert and
      # letting two breaking removals land unrecorded. Promote in the release-preparation commit
      # (`just promote-public-api`), commit it, then tag that exact commit.
      # Preview releases are exempt: pending entries are their normal state.
      - name: Verify the public API baseline is promoted
        if: inputs.release_type == 'official'
        run: |
          if ! bash scripts/promote-public-api.sh --check; then
            echo "::error::PublicAPI.Unshipped.txt is not empty. Run 'just promote-public-api', commit the result, and re-tag."
            exit 1
          fi

      # No explicit restore step: `just pack` opens with its own clean + restore + build
      # (justfile:236-238), so anything restored here is discarded moments later.
      - name: Pack
        run: just pack

      - name: Run extensible-turn packed-package gate
        run: just smoke-extensible-turns-packed

      # This must run before NuGet authentication/publishing. It consumes the freshly packed
      # local nupkgs and executes both libraries' netstandard2.1 assets on a real .NET Core 3.1
      # runtime, rather than relying on the development-machine net8 proxy.
      #
      # 3.1 is end-of-life, and that is the point: it is the down-level runtime the netstandard2.1
      # assets exist for, so upgrading the image would stop testing what ships. Pinned by digest
      # because an EOL tag is the kind that gets retagged or withdrawn — re-resolve with
      # `docker manifest inspect mcr.microsoft.com/dotnet/sdk:3.1` if it ever needs moving.
      - name: Run down-level runtime gate
        run: |
          package=$(find artifacts/packages -maxdepth 1 -name 'TemporalCommunity.Extensions.AI.*.nupkg' -print -quit)
          test -n "$package"
          packed_version=$(basename "$package" | sed -E 's/^TemporalCommunity\.Extensions\.AI\.(.*)\.nupkg$/\1/')
          docker run --rm \
            -v "$PWD/tests/smoke/DownLevelSmokeTest:/src" \
            -v "$PWD/artifacts/packages:/artifacts/packages:ro" \
            -e PACKED_VERSION="$packed_version" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:3.1@sha256:28ab344bca8209cd67d2b1478192da7b78416a8d71ed364f0c4e004f9d7fb804 \
            dotnet run --configuration Debug

      # Exchange the GitHub OIDC JWT for a short-lived NuGet API key.
      # NuGet/login hits https://www.nuget.org/api/v2/token with the OIDC token
      # and returns a single-use key valid for ~1 hour.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: cecilphillip
          token-service-url: https://www.nuget.org/api/v2/token

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
