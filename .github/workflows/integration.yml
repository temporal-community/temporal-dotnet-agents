name: Integration Tests

# Integration suites use an embedded Temporal server (WorkflowEnvironment.StartLocalAsync)
# and hand-written stub chat clients — no external server and no OPENAI_API_KEY required.
# They are slower than the unit suites (embedded-server boot per fixture; collections run
# serially per xunit.runner.json), so they run on their own workflow rather than blocking
# the fast build/PR feedback loop in build.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Agents
            path: tests/TemporalCommunity.Extensions.Agents.IntegrationTests
          - name: AI
            path: tests/TemporalCommunity.Extensions.AI.IntegrationTests

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # MinVer needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup just
        uses: extractions/setup-just@v4.0.0

      - name: Build
        run: just build

      - name: Integration tests (${{ matrix.suite.name }})
        run: >
          dotnet test ${{ matrix.suite.path }}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-${{ matrix.suite.name }}.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: integration-test-results-${{ matrix.suite.name }}
          path: ${{ matrix.suite.path }}/**/*.trx
          if-no-files-found: error
