name: Integration Tests

# Integration suites use an embedded Temporal server (WorkflowEnvironment.StartLocalAsync)
# and hand-written stub chat clients — no external server and no OPENAI_API_KEY required.
# They are slower than the unit suites (embedded-server boot per fixture; collections run
# serially per xunit.runner.json), so they run on their own workflow rather than blocking
# the fast build/PR feedback loop in build.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    # Embedded-server suites can occasionally hang on server startup; fail fast
    # rather than burning the 6-hour default job timeout.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Listed literally. This set has been these two — one per library — since 2026-03-18, and
      # the same two are already spelled out in TemporalAgents.slnx and in the justfile's
      # integration_tests_dir / integration_tests_ai_dir. Adding a third suite means editing those
      # anyway; this is the third line, not a new kind of work.
      matrix:
        suite:
          # Ordered as the discovery script sorted them, so the PR checks list does not reshuffle.
          - name: TemporalCommunity.Extensions.AI.IntegrationTests
            project: tests/TemporalCommunity.Extensions.AI.IntegrationTests/TemporalCommunity.Extensions.AI.IntegrationTests.csproj
          - name: TemporalCommunity.Extensions.Agents.IntegrationTests
            project: tests/TemporalCommunity.Extensions.Agents.IntegrationTests/TemporalCommunity.Extensions.Agents.IntegrationTests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # MinVer needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache verified Temporal CLI
        uses: actions/cache@v5.0.3
        with:
          path: .cache/temporal-cli/v1.8.0
          key: temporal-cli-${{ runner.os }}-${{ runner.arch }}-v1.8.0

      - name: Prepare verified Temporal CLI
        run: echo "TEMPORAL_TEST_SERVER_PATH=$(.github/scripts/prepare-temporal-cli.sh .cache/temporal-cli/v1.8.0)" >> "$GITHUB_ENV"

      - name: Restore selected suite
        run: dotnet restore ${{ matrix.suite.project }}

      - name: Build selected suite
        run: dotnet build ${{ matrix.suite.project }} --configuration Release --no-restore

      - name: Integration tests (${{ matrix.suite.name }})
        # console logger streams per-test Starting/Finished so a hang is visible in the log.
        # --blame-hang-timeout terminates and NAMES any test exceeding the per-test budget
        # (most integration tests finish in seconds), turning an opaque 20-min job hang into a
        # named culprit and a fast failure. --blame-hang-dump-type none skips the (large) dump.
        run: >
          dotnet test ${{ matrix.suite.project }}
          --configuration Release
          --no-build
          --filter "Category!=HistoryCapture"
          --blame-hang-timeout 4m
          --blame-hang-dump-type none
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=integration-${{ matrix.suite.name }}.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: integration-test-results-${{ matrix.suite.name }}
          path: tests/**/TestResults/**/*.trx
          if-no-files-found: ignore
